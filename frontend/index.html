<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>偉業予測AI - トップ</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="page-top">
  <header class="site-header">
    <h1 class="site-title">偉業予測AI</h1>
  </header>

  <main class="container">
    <section class="card hero-card top-card">
      <h2>顔画像から偉業カテゴリを予測するWebアプリ</h2>

      <p class="description">
        このアプリは、顔画像をもとに
        偉業のカテゴリを予測する研究・学習用Webアプリケーションです。
      </p>

      <p class="description">
        画像をアップロードすると、機械学習モデルによって
        大分類と小分類の予測結果を確認できます。
      </p>

      <div class="notice-box">
        <p>
          ※ 本アプリは研究・学習目的のデモです。<br />
          結果は参考情報であり、人物の価値・能力・将来を断定するものではありません。
        </p>
      </div>

      <div class="button-area">
        <button id="startButton" class="primary-button">診断を始める</button>
      </div>
    </section>
  </main>

  <script src="./js/index.js"></script>
</body>
</html>

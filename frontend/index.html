<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>偉業予測AI - トップ</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="page-top">
  <div class="app-bg-decoration"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-mark">AI</div>
      <h1 class="site-title">偉業予測AI</h1>
    </div>
  </header>

  <main class="container">
    <section class="card hero-card top-card">
      <div class="hero-layout">
        <div class="hero-icon">◎</div>

        <div class="hero-content">
          <h2>顔画像から偉業カテゴリを<br class="pc-only" />予測するWebアプリ</h2>

          <p class="description">
            本アプリは研究・学習目的のデモです。
          </p>

          <p class="description">
            顔画像をアップロードすると、AIがその人物の偉業カテゴリ
            （大分類・小分類）を予測します。
          </p>

          <div class="notice-box">
            <span class="notice-icon">i</span>
            <p>
              ※ 本アプリは研究・学習目的のデモです。<br />
              結果は参考情報であり、人物の価値・能力・将来を断定するものではありません。
            </p>
          </div>

          <div class="button-area center">
            <button id="startButton" class="primary-button">
              診断を始める
              <span>›</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./js/index.js"></script>
</body>
</html>

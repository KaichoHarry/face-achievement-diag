<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>偉業予測AI - 診断</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="page-diagnosis">
  <div class="app-bg-decoration"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="app-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path class="logo-head" d="M29 6C17.4 6 8 15.4 8 27c0 7.2 3.6 13.6 9.1 17.4V56h22v-8h6.4c2.5 0 4.5-2 4.5-4.5v-6.8l5.2-2.6-5.2-8.7C49.2 14.5 40.4 6 29 6z" />
          <circle cx="25" cy="20" r="3" />
          <circle cx="36" cy="18" r="3" />
          <circle cx="33" cy="31" r="3" />
          <path class="logo-line" d="M25 20L36 18M36 18L33 31M25 20L33 31" />
        </svg>
      </div>

      <h1 class="site-title">偉業予測AI</h1>
    </div>
  </header>

  <main class="container">
    <section class="card diagnosis-card">

      <div class="diagnosis-heading">
        <div class="face-icon-large" aria-hidden="true">
          <svg viewBox="0 0 80 80">
            <!-- 外側の認識フレーム -->
            <path class="frame-path" d="M24 18h-8v8" />
            <path class="frame-path" d="M56 18h8v8" />
            <path class="frame-path" d="M16 54v8h8" />
            <path class="frame-path" d="M64 54v8h-8" />

            <!-- 人の顔 -->
            <circle class="face-path" cx="40" cy="34" r="12" />

            <!-- 肩・体 -->
            <path class="face-path" d="M22 64c2.8-11 10-17 18-17s15.2 6 18 17" />
          </svg>
        </div>

        <h2>診断画面</h2>

        <p class="description">
          顔画像を選択して、「診断する」ボタンを押してください。<br />
          選択した画像は下にプレビュー表示されます。
        </p>
      </div>

      <div class="form-group">
        <label class="form-label">顔画像を選択</label>

        <label for="imageInput" class="upload-box">
          <span class="upload-icon" aria-hidden="true">
            <svg viewBox="0 0 86 80">
              <path d="M28 58H22c-7.5 0-14-6-14-13.5S14.5 31 22 31h2c3-10 11-17 22-17 13 0 23 10 23 23v1h1c6 0 11 5 11 11s-5 9-11 9h-9" />
              <path d="M40 64V38" />
              <path d="M28 50l12-12 12 12" />
            </svg>
          </span>

          <span class="upload-text-group">
            <span class="upload-button-text">ファイルを選択</span>

            <span class="upload-help">
              またはドラッグ＆ドロップ<br />
              <small>JPG / PNG に対応</small>
            </span>
          </span>
        </label>

        <input type="file" id="imageInput" accept="image/*" />
      </div>

      <div class="preview-label">画像プレビュー</div>

      <div class="preview-area">
        <div class="preview-placeholder">
          <span class="preview-placeholder-icon" aria-hidden="true">
            <svg viewBox="0 0 80 80">
              <rect x="14" y="18" width="52" height="42" rx="6" />
              <circle cx="30" cy="33" r="5" />
              <path d="M18 56l16-16 11 11 7-7 11 12" />
            </svg>
          </span>

          <p>ここにプレビューが表示されます</p>
        </div>

        <img
          id="previewImage"
          class="preview-image hidden"
          src=""
          alt="選択した画像のプレビュー"
        />
      </div>

      <div class="button-area">
        <button id="predictButton" class="primary-button wide-button">
          診断する
          <span>›</span>
        </button>
      </div>

      <p class="secure-text">🔒 保存されません。</p>

      <div id="loadingMessage" class="loading hidden">
        <span class="spinner"></span>
        診断中です。少々お待ちください...
      </div>

      <div id="errorMessage" class="error-message hidden"></div>
    </section>
  </main>

  <script src="./js/diagnosis.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>偉業予測AI - 診断</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="page-diagnosis">
  <div class="app-bg-decoration"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-mark">AI</div>
      <h1 class="site-title">偉業予測AI</h1>
    </div>
  </header>

  <main class="container">
    <section class="card diagnosis-card">
      <div class="page-heading-row">
        <div class="page-icon">◎</div>

        <div>
          <h2>診断画面</h2>
          <p class="description">
            顔画像を選択して、「診断する」ボタンを押してください。<br />
            選択した画像は下にプレビュー表示されます。
          </p>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">顔画像を選択</label>

        <label for="imageInput" class="upload-box">
          <span class="upload-icon">☁</span>

          <span class="upload-button-text">ファイルを選択</span>

          <span class="upload-help">
            またはドラッグ＆ドロップ<br />
            <small>JPG / PNG に対応</small>
          </span>
        </label>

        <input type="file" id="imageInput" accept="image/*" />
      </div>

      <div class="preview-label">画像プレビュー</div>

      <div class="preview-area">
        <div class="preview-placeholder">
          <span class="preview-placeholder-icon">▧</span>
          <p>ここにプレビューが表示されます</p>
        </div>

        <img
          id="previewImage"
          class="preview-image hidden"
          src=""
          alt="選択した画像のプレビュー"
        />
      </div>

      <div class="button-area">
        <button id="predictButton" class="primary-button wide-button">
          診断する
          <span>›</span>
        </button>
      </div>

      <p class="secure-text">🔒 画像は安全に処理され、保存されません。</p>

      <div id="loadingMessage" class="loading hidden">
        <span class="spinner"></span>
        診断中です。少々お待ちください...
      </div>

      <div id="errorMessage" class="error-message hidden"></div>
    </section>
  </main>

  <script src="./js/diagnosis.js"></script>
</body>
</html>
